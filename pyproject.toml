[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-old-date"
version = "0.1.0"
description = "Local photo date-stamp scanner and metadata writer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "Pillow>=10.3,<13",
  "opencv-python>=4.9,<5",
  "pytesseract>=0.3.10",
  "PySide6>=6.7,<7",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
scan-old-date = "scan_old_date.cli:main"
scan-old-date-gui = "scan_old_date.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
